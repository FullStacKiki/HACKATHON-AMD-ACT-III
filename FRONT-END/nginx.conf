server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The backend (a panel run is polled, but the briefing and the survey wait for an agent: allow minutes)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Single-page app: every other route is served by index.html
  location / {
    try_files $uri /index.html;
  }
}
